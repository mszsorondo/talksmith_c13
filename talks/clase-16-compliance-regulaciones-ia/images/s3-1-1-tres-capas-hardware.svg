<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 384" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Tres capas: nube, on-prem, edge</title>
  <desc>Tres formas de desplegar IA en salud — nube, on-prem y edge — cada una con su propio mundo regulatorio; elegir entre ellas es una decisión de compliance y costo, no técnica.</desc>

  <rect x="0" y="0" width="680" height="384" fill="#ffffff"/>

  <!-- ===== CAPA 3 — EDGE / EMBEBIDO (focal: hardware ES el dispositivo) ===== -->
  <g>
    <rect x="32" y="24" width="616" height="92" rx="6" fill="#FFFFFF" stroke="#DA1B2E" stroke-width="2.2"/>
    <rect x="32" y="24" width="6" height="92" rx="3" fill="#DA1B2E"/>
    <text x="52" y="50" font-size="15" font-weight="700" fill="#DA1B2E">CAPA 3 · EDGE / EMBEBIDO</text>
    <text x="312" y="50" font-size="11.5" fill="#6A737D">el aparato: ecógrafo, bomba de infusión</text>
    <text x="52" y="74" font-size="12.5" font-weight="700" fill="#1F1E1E">El hardware ES el dispositivo médico</text>
    <text x="358" y="74" font-size="11.5" fill="#3B3535">certifica IEC 60601 / IEC 62304</text>
    <text x="52" y="98" font-size="11" fill="#3B3535">Tiempo real · sin red · una falla = daño físico inmediato al paciente</text>
  </g>

  <!-- ===== CAPA 2 — ON-PREM ===== -->
  <g>
    <rect x="32" y="146" width="616" height="92" rx="6" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="32" y="146" width="6" height="92" rx="3" fill="#D8D4D4"/>
    <text x="52" y="172" font-size="15" font-weight="700" fill="#1F1E1E">CAPA 2 · ON-PREM</text>
    <text x="252" y="172" font-size="11.5" fill="#6A737D">servidor / GPU en el datacenter del hospital</text>
    <text x="52" y="196" font-size="12.5" font-weight="700" fill="#1F1E1E">Control físico — el dato no sale del edificio</text>
    <text x="52" y="220" font-size="11" fill="#3B3535">Encriptación at-rest · destrucción de discos · redundancia</text>
  </g>

  <!-- ===== CAPA 1 — NUBE ===== -->
  <g>
    <rect x="32" y="268" width="616" height="92" rx="6" fill="#F2EEEE" stroke="#D8D4D4" stroke-width="1.4"/>
    <rect x="32" y="268" width="6" height="92" rx="3" fill="#D8D4D4"/>
    <text x="52" y="294" font-size="15" font-weight="700" fill="#1F1E1E">CAPA 1 · NUBE</text>
    <text x="228" y="294" font-size="11.5" fill="#6A737D">GPU alquilada en AWS / GCP / Azure</text>
    <text x="52" y="318" font-size="12.5" font-weight="700" fill="#1F1E1E">Data residency · BAA · shared responsibility model</text>
    <text x="52" y="342" font-size="11" fill="#3B3535">Transferencia internacional de datos (Ley 25.326 / GDPR)</text>
  </g>
</svg>
