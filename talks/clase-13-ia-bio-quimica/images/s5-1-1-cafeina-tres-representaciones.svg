<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 383" font-family="Helvetica, Arial, sans-serif">
  <title>Tres formas de representar la cafeína</title>
  <desc>Tres representaciones de la cafeína lado a lado: SMILES como string, grafo molecular como átomos y enlaces, fingerprint como vector binario. Cada panel indica qué tipo de modelo lo consume.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="680" height="383" fill="#ffffff"/>

  <!-- Top label: Cafeína -->
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#3B3535">Cafeína</text>
  <text x="340" y="46" text-anchor="middle" font-size="11" fill="#7a6f6f">misma molécula · tres representaciones</text>

  <!-- ============ Panel 1: SMILES ============ -->
  <rect x="22" y="62" width="198" height="232" rx="6" ry="6"
        fill="#f6f4f2" stroke="#3B3535" stroke-width="1.2"/>
  <!-- panel title bar -->
  <rect x="22" y="62" width="198" height="26" rx="6" ry="6" fill="#ececea" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="22" y="80" width="198" height="8" fill="#ececea" stroke="none"/>
  <line x1="22" y1="88" x2="220" y2="88" stroke="#3B3535" stroke-width="1.2"/>
  <text x="121" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">SMILES</text>

  <!-- SMILES string (monospace) -->
  <text x="121" y="120" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#3B3535">CN1C=NC2=C1C(=O)</text>
  <text x="121" y="138" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#3B3535">N(C(=O)N2C)C</text>

  <!-- divider -->
  <line x1="42" y1="160" x2="200" y2="160" stroke="#cfc8c4" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- descriptors -->
  <text x="121" y="184" text-anchor="middle" font-size="11" fill="#3B3535">string · legible</text>
  <text x="121" y="204" text-anchor="middle" font-size="11" fill="#3B3535">formato estándar</text>
  <text x="121" y="222" text-anchor="middle" font-size="10" fill="#7a6f6f">(ZINC, ChEMBL, PubChem)</text>

  <!-- caption inside panel bottom -->
  <text x="121" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3535">modelos secuenciales</text>
  <text x="121" y="290" text-anchor="middle" font-size="10" fill="#7a6f6f">LSTM · transformers</text>

  <!-- ============ Panel 2: Grafo molecular ============ -->
  <rect x="241" y="62" width="198" height="232" rx="6" ry="6"
        fill="#f6f4f2" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="241" y="62" width="198" height="26" rx="6" ry="6" fill="#ececea" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="241" y="80" width="198" height="8" fill="#ececea" stroke="none"/>
  <line x1="241" y1="88" x2="439" y2="88" stroke="#3B3535" stroke-width="1.2"/>
  <text x="340" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">Grafo molecular</text>

  <!-- Stylized caffeine graph: bonds (edges) -->
  <!-- Coordinates carefully placed in panel interior 241..439 x 95..240 -->
  <g stroke="#3B3535" stroke-width="1.4" fill="none" stroke-linecap="round">
    <!-- 6-membered ring: N1-C2-N3-C4-C5-C6-N1 -->
    <line x1="300" y1="120" x2="330" y2="110"/>   <!-- N1 - C2 -->
    <line x1="330" y1="110" x2="360" y2="120"/>   <!-- C2 - N3 -->
    <line x1="360" y1="120" x2="360" y2="155"/>   <!-- N3 - C4 -->
    <line x1="360" y1="155" x2="330" y2="170"/>   <!-- C4 - C5 -->
    <line x1="330" y1="170" x2="300" y2="155"/>   <!-- C5 - C6 -->
    <line x1="300" y1="155" x2="300" y2="120"/>   <!-- C6 - N1 -->

    <!-- 5-membered ring fused: C4-N7-C8-N9-C5 -->
    <line x1="360" y1="155" x2="390" y2="158"/>   <!-- C4 - N7 -->
    <line x1="390" y1="158" x2="385" y2="187"/>   <!-- N7 - C8 -->
    <line x1="385" y1="187" x2="352" y2="190"/>   <!-- C8 - N9 -->
    <line x1="352" y1="190" x2="330" y2="170"/>   <!-- N9 - C5 -->

    <!-- Double bond marker: C2=O? No, carbonyls: C6=O and C2 is between N1 and N3 -->
    <!-- C6 carbonyl (=O) extending left -->
    <line x1="300" y1="155" x2="278" y2="172"/>   <!-- C6 - O -->
    <line x1="297" y1="160" x2="278" y2="175"/>   <!-- = parallel -->

    <!-- Methyl on N1 (up-left) -->
    <line x1="300" y1="120" x2="278" y2="105"/>

    <!-- Methyl on N3 (right-up) -->
    <line x1="360" y1="120" x2="382" y2="105"/>

    <!-- Methyl on N9 (down-left) -->
    <line x1="352" y1="190" x2="338" y2="215"/>
  </g>

  <!-- Atom labels (text on light disk to clear lines) -->
  <g font-size="10" font-weight="700" fill="#3B3535" text-anchor="middle">
    <circle cx="300" cy="120" r="7" fill="#f6f4f2"/><text x="300" y="123">N</text>
    <circle cx="330" cy="110" r="7" fill="#f6f4f2"/><text x="330" y="113">C</text>
    <circle cx="360" cy="120" r="7" fill="#f6f4f2"/><text x="360" y="123">N</text>
    <circle cx="360" cy="155" r="7" fill="#f6f4f2"/><text x="360" y="158">C</text>
    <circle cx="330" cy="170" r="7" fill="#f6f4f2"/><text x="330" y="173">C</text>
    <circle cx="300" cy="155" r="7" fill="#f6f4f2"/><text x="300" y="158">C</text>
    <circle cx="390" cy="158" r="7" fill="#f6f4f2"/><text x="390" y="161">N</text>
    <circle cx="385" cy="187" r="7" fill="#f6f4f2"/><text x="385" y="190">C</text>
    <circle cx="352" cy="190" r="7" fill="#f6f4f2"/><text x="352" y="193">N</text>
    <circle cx="278" cy="172" r="7" fill="#f6f4f2"/><text x="278" y="175">O</text>
    <circle cx="278" cy="105" r="9" fill="#f6f4f2"/><text x="278" y="108" font-size="9">CH<tspan font-size="7" dy="2">3</tspan></text>
    <circle cx="382" cy="105" r="9" fill="#f6f4f2"/><text x="382" y="108" font-size="9">CH<tspan font-size="7" dy="2">3</tspan></text>
    <circle cx="338" cy="215" r="9" fill="#f6f4f2"/><text x="338" y="218" font-size="9">CH<tspan font-size="7" dy="2">3</tspan></text>
  </g>

  <!-- descriptors -->
  <text x="340" y="246" text-anchor="middle" font-size="11" fill="#3B3535">átomos = nodos · enlaces = aristas</text>

  <!-- caption inside panel bottom -->
  <text x="340" y="276" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3535">GNNs</text>
  <text x="340" y="290" text-anchor="middle" font-size="10" fill="#7a6f6f">próxima sección</text>

  <!-- ============ Panel 3: Fingerprint ============ -->
  <rect x="460" y="62" width="198" height="232" rx="6" ry="6"
        fill="#f6f4f2" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="460" y="62" width="198" height="26" rx="6" ry="6" fill="#ececea" stroke="#3B3535" stroke-width="1.2"/>
  <rect x="460" y="80" width="198" height="8" fill="#ececea" stroke="none"/>
  <line x1="460" y1="88" x2="658" y2="88" stroke="#3B3535" stroke-width="1.2"/>
  <text x="559" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">Fingerprint</text>

  <!-- Bit-grid visual: 8 cols x 4 rows = 32 cells -->
  <g stroke="#3B3535" stroke-width="0.8">
    <!-- Row 1 -->
    <rect x="478" y="108" width="16" height="16" fill="#ffffff"/>
    <rect x="494" y="108" width="16" height="16" fill="#3B3535"/>
    <rect x="510" y="108" width="16" height="16" fill="#ffffff"/>
    <rect x="526" y="108" width="16" height="16" fill="#3B3535"/>
    <rect x="542" y="108" width="16" height="16" fill="#3B3535"/>
    <rect x="558" y="108" width="16" height="16" fill="#ffffff"/>
    <rect x="574" y="108" width="16" height="16" fill="#ffffff"/>
    <rect x="590" y="108" width="16" height="16" fill="#3B3535"/>
    <!-- Row 2 -->
    <rect x="478" y="124" width="16" height="16" fill="#3B3535"/>
    <rect x="494" y="124" width="16" height="16" fill="#ffffff"/>
    <rect x="510" y="124" width="16" height="16" fill="#ffffff"/>
    <rect x="526" y="124" width="16" height="16" fill="#3B3535"/>
    <rect x="542" y="124" width="16" height="16" fill="#ffffff"/>
    <rect x="558" y="124" width="16" height="16" fill="#3B3535"/>
    <rect x="574" y="124" width="16" height="16" fill="#ffffff"/>
    <rect x="590" y="124" width="16" height="16" fill="#ffffff"/>
    <!-- Row 3 -->
    <rect x="478" y="140" width="16" height="16" fill="#ffffff"/>
    <rect x="494" y="140" width="16" height="16" fill="#3B3535"/>
    <rect x="510" y="140" width="16" height="16" fill="#3B3535"/>
    <rect x="526" y="140" width="16" height="16" fill="#ffffff"/>
    <rect x="542" y="140" width="16" height="16" fill="#ffffff"/>
    <rect x="558" y="140" width="16" height="16" fill="#3B3535"/>
    <rect x="574" y="140" width="16" height="16" fill="#3B3535"/>
    <rect x="590" y="140" width="16" height="16" fill="#ffffff"/>
    <!-- Row 4 -->
    <rect x="478" y="156" width="16" height="16" fill="#3B3535"/>
    <rect x="494" y="156" width="16" height="16" fill="#ffffff"/>
    <rect x="510" y="156" width="16" height="16" fill="#3B3535"/>
    <rect x="526" y="156" width="16" height="16" fill="#ffffff"/>
    <rect x="542" y="156" width="16" height="16" fill="#3B3535"/>
    <rect x="558" y="156" width="16" height="16" fill="#ffffff"/>
    <rect x="574" y="156" width="16" height="16" fill="#3B3535"/>
    <rect x="590" y="156" width="16" height="16" fill="#3B3535"/>
  </g>
  <text x="612" y="146" font-size="14" fill="#7a6f6f">…</text>

  <text x="559" y="195" text-anchor="middle" font-size="10" font-family="Menlo, Consolas, monospace" fill="#3B3535">[0,1,0,1,1,0, … ,0,1]</text>

  <!-- divider -->
  <line x1="480" y1="210" x2="638" y2="210" stroke="#cfc8c4" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="559" y="230" text-anchor="middle" font-size="11" fill="#3B3535">vector binario · ~2048 bits</text>
  <text x="559" y="248" text-anchor="middle" font-size="10" fill="#7a6f6f">1 = la molécula contiene</text>
  <text x="559" y="261" text-anchor="middle" font-size="10" fill="#7a6f6f">cierta subestructura</text>

  <!-- caption inside panel bottom -->
  <text x="559" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#3B3535">búsqueda rápida (Tanimoto)</text>

  <!-- ============ Bottom caption strip ============ -->
  <text x="340" y="328" text-anchor="middle" font-size="11" fill="#7a6f6f">cada representación habilita una familia distinta de modelos</text>

  <!-- subtle bottom rule -->
  <line x1="22" y1="350" x2="658" y2="350" stroke="#ececea" stroke-width="1"/>
  <text x="340" y="368" text-anchor="middle" font-size="10" fill="#7a6f6f">la elección de representación es la mitad del problema</text>
</svg>
