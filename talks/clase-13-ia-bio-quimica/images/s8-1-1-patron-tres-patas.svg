<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="Helvetica, Arial, sans-serif">
  <title>El patrón común</title>
  <desc>Diagrama en triángulo: un nodo superior "IA que cambia un dominio" se ramifica en tres pilares de igual peso — representación correcta del dominio, arquitectura escalable, datos masivos abiertos — cada uno con ejemplos debajo que muestran que la receta generaliza a varios dominios.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="680" height="430" fill="#ffffff"/>

  <!-- Top box: focal accent -->
  <rect x="220" y="20" width="240" height="50" rx="4" ry="4"
        fill="#ffffff" stroke="#DA1B2E" stroke-width="1.8"/>
  <text x="340" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#DA1B2E">
    IA que cambia un dominio
  </text>

  <!-- Vertical trunk from top box -->
  <line x1="340" y1="70" x2="340" y2="105" stroke="#3B3535" stroke-width="1.4"/>

  <!-- Horizontal manifold across the three pillars -->
  <line x1="115" y1="105" x2="565" y2="105" stroke="#3B3535" stroke-width="1.4"/>

  <!-- Three vertical drops to pillars -->
  <line x1="115" y1="105" x2="115" y2="140" stroke="#3B3535" stroke-width="1.4"/>
  <line x1="340" y1="105" x2="340" y2="140" stroke="#3B3535" stroke-width="1.4"/>
  <line x1="565" y1="105" x2="565" y2="140" stroke="#3B3535" stroke-width="1.4"/>

  <!-- Arrowheads at pillar tops -->
  <polygon points="115,148 110,140 120,140" fill="#3B3535"/>
  <polygon points="340,148 335,140 345,140" fill="#3B3535"/>
  <polygon points="565,148 560,140 570,140" fill="#3B3535"/>

  <!-- Pillar 1: representación -->
  <rect x="35" y="150" width="160" height="70" rx="4" ry="4"
        fill="#F4F2F2" stroke="#3B3535" stroke-width="1.2"/>
  <text x="115" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">representación</text>
  <text x="115" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">correcta del</text>
  <text x="115" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">dominio</text>

  <!-- Pillar 2: arquitectura -->
  <rect x="260" y="150" width="160" height="70" rx="4" ry="4"
        fill="#F4F2F2" stroke="#3B3535" stroke-width="1.2"/>
  <text x="340" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">arquitectura</text>
  <text x="340" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">escalable</text>

  <!-- Pillar 3: datos -->
  <rect x="485" y="150" width="160" height="70" rx="4" ry="4"
        fill="#F4F2F2" stroke="#3B3535" stroke-width="1.2"/>
  <text x="565" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">datos masivos</text>
  <text x="565" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#3B3535">abiertos</text>

  <!-- Examples beneath pillar 1 -->
  <text x="115" y="252" text-anchor="middle" font-size="11.5" fill="#3B3535">grafos para moléculas</text>
  <text x="115" y="270" text-anchor="middle" font-size="11.5" fill="#3B3535">MSA / LLM proteínas</text>
  <text x="115" y="288" text-anchor="middle" font-size="11.5" fill="#3B3535">voxels imág. médicas</text>
  <text x="115" y="306" text-anchor="middle" font-size="11.5" fill="#3B3535">tokens de ADN</text>

  <!-- Examples beneath pillar 2 -->
  <text x="340" y="252" text-anchor="middle" font-size="11.5" fill="#3B3535">GNNs</text>
  <text x="340" y="270" text-anchor="middle" font-size="11.5" fill="#3B3535">transformers</text>
  <text x="340" y="288" text-anchor="middle" font-size="11.5" fill="#3B3535">modelos de difusión</text>

  <!-- Examples beneath pillar 3 -->
  <text x="565" y="252" text-anchor="middle" font-size="11.5" fill="#3B3535">PDB</text>
  <text x="565" y="270" text-anchor="middle" font-size="11.5" fill="#3B3535">UniProt</text>
  <text x="565" y="288" text-anchor="middle" font-size="11.5" fill="#3B3535">ZINC, ChEMBL</text>
  <text x="565" y="306" text-anchor="middle" font-size="11.5" fill="#3B3535">AlphaFold DB</text>

  <!-- Footer caption: the punchline -->
  <line x1="60" y1="350" x2="620" y2="350" stroke="#D8D4D4" stroke-width="1"/>
  <text x="340" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#DA1B2E">
    Las tres juntas habilitaron el salto
  </text>
  <text x="340" y="402" text-anchor="middle" font-size="11.5" fill="#3B3535">
    Cuando un dominio cumple las tres, la IA generativa entra y lo cambia
  </text>
</svg>
