<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <title>Message passing — propagación de información en k capas</title>
  <desc>Cuatro columnas que muestran el mismo grafo molecular en las capas 0, 1, 2 y 3 de message passing; los nodos informados (en rojo) se propagan progresivamente hasta cubrir todo el grafo.</desc>

  <defs>
    <style>
      .header { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #3B3535; text-anchor: middle; }
      .sub    { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; font-weight: 400; fill: #6B6363; text-anchor: middle; }
      .legend { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; fill: #3B3535; }
      .arrow  { stroke: #6B6363; stroke-width: 1.4; fill: none; }
      .edge   { stroke: #9A9494; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B6363"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <g>
    <text class="header" x="90"  y="32">capa 0</text>
    <text class="sub"    x="90"  y="48">(inicial)</text>

    <text class="header" x="250" y="32">capa 1</text>
    <text class="sub"    x="250" y="48">(vecinos directos)</text>

    <text class="header" x="410" y="32">capa 2</text>
    <text class="sub"    x="410" y="48">(vecinos-de-vecinos)</text>

    <text class="header" x="570" y="32">capa 3</text>
    <text class="sub"    x="570" y="48">(toda la molécula)</text>
  </g>

  <!--
    Graph layout (7 nodes per column), centered around (cx, 150).
    Node positions relative to column center:
      n1: top-left      (-30, -40)
      n2: top-right     ( 30, -40)
      n3: left          (-50,   0)
      n4: center        (  0,   0)
      n5: right-outer   ( 55,   0)
      n6: bottom-left   (-30,  40)
      n7: bottom-right  ( 30,  40)
    Edges: n1-n2 (top), n1-n3, n2-n5, n3-n4, n4-n5 (with extra link to right), n3-n6, n5-n7, n6-n7 (bottom), n4-n7 (diagonal)
  -->

  <!-- ===== COLUMN 1: capa 0 — all uninformed ===== -->
  <g transform="translate(90,150)">
    <line class="edge" x1="-30" y1="-40" x2="30"  y2="-40"/>
    <line class="edge" x1="-30" y1="-40" x2="-50" y2="0"/>
    <line class="edge" x1="30"  y1="-40" x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="0"   y2="0"/>
    <line class="edge" x1="0"   y1="0"   x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="-30" y2="40"/>
    <line class="edge" x1="55"  y1="0"   x2="30"  y2="40"/>
    <line class="edge" x1="-30" y1="40"  x2="30"  y2="40"/>
    <line class="edge" x1="0"   y1="0"   x2="30"  y2="40"/>
    <!-- 7 uninformed nodes -->
    <circle cx="-30" cy="-40" r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="30"  cy="-40" r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="-50" cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="0"   cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="55"  cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="-30" cy="40"  r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="30"  cy="40"  r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
  </g>

  <!-- Arrow between col 1 and col 2 -->
  <line class="arrow" x1="158" y1="150" x2="182" y2="150" marker-end="url(#arrowhead)"/>

  <!-- ===== COLUMN 2: capa 1 — 2 informed nodes (top-left + center) ===== -->
  <g transform="translate(250,150)">
    <line class="edge" x1="-30" y1="-40" x2="30"  y2="-40"/>
    <line class="edge" x1="-30" y1="-40" x2="-50" y2="0"/>
    <line class="edge" x1="30"  y1="-40" x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="0"   y2="0"/>
    <line class="edge" x1="0"   y1="0"   x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="-30" y2="40"/>
    <line class="edge" x1="55"  y1="0"   x2="30"  y2="40"/>
    <line class="edge" x1="-30" y1="40"  x2="30"  y2="40"/>
    <line class="edge" x1="0"   y1="0"   x2="30"  y2="40"/>
    <!-- 2 informed: n1 (top-left), n4 (center) -->
    <circle cx="-30" cy="-40" r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="30"  cy="-40" r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="-50" cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="0"   cy="0"   r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="55"  cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="-30" cy="40"  r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="30"  cy="40"  r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
  </g>

  <!-- Arrow between col 2 and col 3 -->
  <line class="arrow" x1="318" y1="150" x2="342" y2="150" marker-end="url(#arrowhead)"/>

  <!-- ===== COLUMN 3: capa 2 — 5 informed nodes ===== -->
  <g transform="translate(410,150)">
    <line class="edge" x1="-30" y1="-40" x2="30"  y2="-40"/>
    <line class="edge" x1="-30" y1="-40" x2="-50" y2="0"/>
    <line class="edge" x1="30"  y1="-40" x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="0"   y2="0"/>
    <line class="edge" x1="0"   y1="0"   x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="-30" y2="40"/>
    <line class="edge" x1="55"  y1="0"   x2="30"  y2="40"/>
    <line class="edge" x1="-30" y1="40"  x2="30"  y2="40"/>
    <line class="edge" x1="0"   y1="0"   x2="30"  y2="40"/>
    <!-- 5 informed: n1, n2, n4, n6, n7 -->
    <circle cx="-30" cy="-40" r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="30"  cy="-40" r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="-50" cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="0"   cy="0"   r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="55"  cy="0"   r="8" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <circle cx="-30" cy="40"  r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="30"  cy="40"  r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
  </g>

  <!-- Arrow between col 3 and col 4 -->
  <line class="arrow" x1="478" y1="150" x2="502" y2="150" marker-end="url(#arrowhead)"/>

  <!-- ===== COLUMN 4: capa 3 — all 7 informed ===== -->
  <g transform="translate(570,150)">
    <line class="edge" x1="-30" y1="-40" x2="30"  y2="-40"/>
    <line class="edge" x1="-30" y1="-40" x2="-50" y2="0"/>
    <line class="edge" x1="30"  y1="-40" x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="0"   y2="0"/>
    <line class="edge" x1="0"   y1="0"   x2="55"  y2="0"/>
    <line class="edge" x1="-50" y1="0"   x2="-30" y2="40"/>
    <line class="edge" x1="55"  y1="0"   x2="30"  y2="40"/>
    <line class="edge" x1="-30" y1="40"  x2="30"  y2="40"/>
    <line class="edge" x1="0"   y1="0"   x2="30"  y2="40"/>
    <!-- 7 informed -->
    <circle cx="-30" cy="-40" r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="30"  cy="-40" r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="-50" cy="0"   r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="0"   cy="0"   r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="55"  cy="0"   r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="-30" cy="40"  r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <circle cx="30"  cy="40"  r="8" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(0,280)">
    <circle cx="220" cy="0" r="7" fill="#ffffff" stroke="#6B6363" stroke-width="1.6"/>
    <text class="legend" x="236" y="4">no informado</text>

    <circle cx="380" cy="0" r="7" fill="#DA1B2E" stroke="#DA1B2E" stroke-width="1.6"/>
    <text class="legend" x="396" y="4">informado por el message passing</text>
  </g>
</svg>
